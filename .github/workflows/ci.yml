name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    strategy:
      matrix:
        php: ['8.4']
    name: Tests (PHP ${{ matrix.php }})
    env:
      NETHERNET_NATIVE_PREFIX: ${{ github.workspace }}/.native
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php }}
          ini-values: xdebug.max_nesting_level=3000
          extensions: encoding-pmmp/ext-encoding@1.0.0
          tools: php-config

      - uses: actions/checkout@v4
        with:
          repository: Bedrock-Phanatics/ext-bedwire
          ref: ea8792b0405392f5a2f64d336007de748f0abea0
          path: .ext-bedwire

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build ext-bedwire
        working-directory: .ext-bedwire
        run: |
          zig build --fetch
          sh "$(ls -d zig-pkg/nethernet-* | head -1)/tools/setup-native.sh"
          zig build -Doptimize=ReleaseFast -Dphp-include-dir="$(php-config --include-dir)"
          echo "extension=$PWD/zig-out/modules/bedwire.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-bedwire.ini"
          php -r 'exit(extension_loaded("bedwire") ? 0 : 1);'

      - name: Load Composer package cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/composer"
          key: "php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-composer-"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyze --no-progress

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit

  codegen:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    needs: codestyle #to avoid false positives
    name: Generated Code consistency checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: 8.2
          ini-values: xdebug.max_nesting_level=3000
          tools: php-cs-fixer:3
          extensions: encoding-pmmp/ext-encoding@1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Composer package cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/composer"
          key: "php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-composer-"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --ignore-platform-req=ext-bedwire

      - name: Verify ::create() methods are up to date
        run: |
          php tools/generate-create-static-methods.php
          php-cs-fixer fix
          git diff
          git diff --quiet #to set the exit code

  codestyle:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    name: Code Style checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: 8.2
          ini-values: xdebug.max_nesting_level=3000
          tools: php-cs-fixer:3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff
